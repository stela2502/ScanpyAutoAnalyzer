[build-system]
requires = [
    "setuptools>=42",
    "pandas>=1.2.4",
    "numpy>=1.17.4",
    "scanpy>=1.7.2",
    "loompy>=3.0.6",
    "scvelo>=0.2.3",
    "jupytext>=1.12.0",
    "phate>=1.0.7",
    "python_igraph>=0.9.6",
    "igraph",
    "nbconvert",
    "ipykernel"

]
build-backend = "setuptools.build_meta"



[project]
name = "ScanpyAutoAnalyzer"
version = "0.0.3"
description = "Single-cell analysis helpers built around Scanpy and AnnData"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stefan Lang" }
]
dependencies = [
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ScanpyAutoAnalyzer*"]
